<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Smart To-Do App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: #2a2a35;
      --accent: #c8ff57;
      --accent2: #57c8ff;
      --text: #f0f0f0;
      --muted: #6b6b7a;
      --done: #3a3a46;
      --done-text: #5a5a6a;
      --danger: #ff5757;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 70% 10%, rgba(200,255,87,0.07) 0%, transparent 70%),
                  radial-gradient(ellipse 40% 40% at 20% 80%, rgba(87,200,255,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 640px;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.05;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      transition: all 0.3s;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .main {
      width: 100%;
      max-width: 640px;
      animation: fadeUp 0.6s 0.15s ease both;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    .task-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .task-input::placeholder { color: var(--muted); }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,255,87,0.1);
    }

    .priority-select {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .priority-select:focus { border-color: var(--accent); }

    .add-btn {
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: var(--radius);
      padding: 14px 22px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      letter-spacing: 0.02em;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(200,255,87,0.3);
    }

    .add-btn:active { transform: translateY(0); }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0f;
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--text);
      color: var(--text);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideIn 0.3s ease both;
      transition: border-color 0.2s, background 0.3s, opacity 0.3s;
      position: relative;
      overflow: hidden;
    }

    .task-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .task-item:hover { border-color: #3a3a4a; }
    .task-item:hover::before { opacity: 1; }

    .task-item.done {
      background: var(--done);
      border-color: var(--done);
      opacity: 0.6;
    }

    .task-item.done::before { opacity: 0 !important; }

    .task-item.priority-high::before { background: var(--danger); opacity: 1; }
    .task-item.priority-medium::before { background: #ffaa00; opacity: 1; }
    .task-item.priority-low::before { background: var(--accent2); opacity: 1; }

    .check-btn {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      color: transparent;
      font-size: 12px;
    }

    .task-item:not(.done) .check-btn:hover {
      border-color: var(--accent);
      background: rgba(200,255,87,0.1);
      color: var(--accent);
    }

    .task-item.done .check-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0f;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .priority-badge {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .badge-high { background: rgba(255,87,87,0.15); color: var(--danger); }
    .badge-medium { background: rgba(255,170,0,0.15); color: #ffaa00; }
    .badge-low { background: rgba(87,200,255,0.15); color: var(--accent2); }

    .delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      opacity: 0;
    }

    .task-item:hover .delete-btn { opacity: 1; }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(255,87,87,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.6;
    }

    .clear-btn {
      margin-top: 28px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }

    .clear-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="label">// course project 1 — 2025</div>
  <h1>Task<span>Flow</span></h1>
  <p class="subtitle">A minimalist task management app built with vanilla HTML, CSS & JavaScript.<br>No frameworks. No dependencies. Just clean code.</p>
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="stat-total">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-active">0</span>
      <span class="stat-label">Active</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-done">0</span>
      <span class="stat-label">Done</span>
    </div>
  </div>
</header>

<main class="main">
  <div class="input-row">
    <input class="task-input" id="taskInput" type="text" placeholder="Add a new task..." maxlength="120" />
    <select class="priority-select" id="prioritySelect">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button class="add-btn" onclick="addTask()">+ Add</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
    <button class="filter-btn" onclick="setFilter('high', this)">🔴 High</button>
    <button class="filter-btn" onclick="setFilter('medium', this)">🟡 Medium</button>
    <button class="filter-btn" onclick="setFilter('low', this)">🔵 Low</button>
  </div>

  <div class="task-list" id="taskList"></div>

  <button class="clear-btn" onclick="clearDone()" id="clearBtn" style="display:none;">
    Clear completed tasks
  </button>
</main>

<script>
  let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
  let filter = 'all';

  function save() {
    localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const priority = document.getElementById('prioritySelect').value;
    const text = input.value.trim();
    if (!text) {
      input.focus();
      input.style.borderColor = 'var(--danger)';
      setTimeout(() => input.style.borderColor = '', 800);
      return;
    }
    tasks.unshift({ id: Date.now(), text, priority, done: false });
    input.value = '';
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const list = document.getElementById('taskList');
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-done').textContent = done;

    document.getElementById('clearBtn').style.display = done > 0 ? 'block' : 'none';

    let filtered = tasks;
    if (filter === 'active') filtered = tasks.filter(t => !t.done);
    else if (filter === 'done') filtered = tasks.filter(t => t.done);
    else if (['high','medium','low'].includes(filter)) filtered = tasks.filter(t => t.priority === filter);

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">✦</div><p>${filter === 'all' ? 'No tasks yet.<br>Add your first task above.' : 'No tasks in this filter.'}</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(t => `
      <div class="task-item ${t.done ? 'done' : ''} priority-${t.priority}">
        <button class="check-btn" onclick="toggleTask(${t.id})">✓</button>
        <span class="task-text">${escHtml(t.text)}</span>
        <div class="task-meta">
          <span class="priority-badge badge-${t.priority}">${t.priority}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // Seed a few demo tasks
  if (tasks.length === 0) {
    tasks = [
      { id: 1, text: 'Read the course handbook', priority: 'high', done: true },
      { id: 2, text: 'Submit project proposal', priority: 'high', done: true },
      { id: 3, text: 'Build the prototype (GitHub repo)', priority: 'medium', done: false },
      { id: 4, text: 'Publish report to GitHub Pages', priority: 'medium', done: false },
      { id: 5, text: 'Prepare 5-7 min defense demo', priority: 'high', done: false },
    ];
    save();
  }

  render();
</script>
</body>
</html>
